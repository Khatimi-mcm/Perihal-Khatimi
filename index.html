<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Perihal Khatimi</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#23201c;--mu:#7a7269;--ac:#1f5c4d;--ac2:#e8f0ed;--bd:#ded8cf;--dn:#b3382c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--tx:#f0ece5;--mu:#9b948a;--ac:#5fb59f;--ac2:#25332f;--bd:#37342f;--dn:#e0786c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-size:22px;letter-spacing:.08em;text-align:center;margin:18px 0 4px}
.sub{text-align:center;color:var(--mu);margin:0 0 28px;font-size:14px}
a.menu,div.menu,button.menu{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;color:var(--tx);font:inherit;cursor:pointer;text-decoration:none}
.menu small{display:block;color:var(--mu);font-size:12px;letter-spacing:.1em}
.menu b{font-size:19px;letter-spacing:.04em}
.top button{background:none;border:0;color:var(--ac);font:inherit;font-weight:600;cursor:pointer;padding:0 0 10px}
h2{font-size:18px;margin:0;letter-spacing:.05em}
.tabs{display:flex;gap:8px;margin:14px 0 16px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);color:var(--tx);font:inherit;font-size:14px;background:var(--card);cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px;letter-spacing:.04em}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
button.b{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.p:disabled{opacity:.6}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;padding:0}
.ph i{position:absolute;left:4px;bottom:4px;background:var(--ac);color:#fff;font-size:10px;font-style:normal;padding:1px 6px;border-radius:99px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pics.one{grid-template-columns:1fr}
.pics img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.pics.one img{height:auto;max-height:300px}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--mu)}
.tag{background:var(--ac2);color:var(--ac);padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px}
.it p{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.act{display:flex;gap:18px;margin-top:8px}
.act button{background:none;border:0;font:inherit;font-size:14px;padding:4px 0;cursor:pointer;color:var(--ac);font-weight:600}
.act .del{color:var(--dn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;display:none;font-size:14px;max-width:90%}
.cnt,.note{color:var(--mu);font-size:13px;margin:14px 0 12px}
.note{text-align:center}
.edn{background:var(--ac2);color:var(--ac);padding:8px 12px;border-radius:10px;font-size:13px;margin-top:12px}
</style></head><body><div class="w" id="app"></div><div class="toast" id="toast"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbw8oj5z2EWh4W97daQnheHjDZEy9F1MSvkICTAEqK6eYTEvE5StJ-zPkno378zrWNfM/exec";
var PERBELANJAAN="https://khatimi-mcm.github.io/Perbelanjaan-Khatimi";
var TYPES=["Keluarga","Saudara mara","Event","Pekerjaan","Fitness","Ilmu/Kemahiran","Lain-lain"];
var MAXP=10;
var newP=[],oldIds=[],rmIds=[],pending=0,DATA=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2500)}
function opts(sel,all){return (all?'<option value="">Semua</option>':"")+TYPES.map(function(x){return "<option"+(x===sel?" selected":"")+">"+x+"</option>"}).join("")}
function thumb(id,w){return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(w||600)}
function ids(s){return s?String(s).split(",").filter(Boolean):[]}
function call(o){return fetch(API,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"Gagal");return j})}
function load(){return fetch(API+"?action=list").then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"Gagal");return j.data})}
function shrink(f,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.onerror=function(){cb(null)};im.src=r.result};r.onerror=function(){cb(null)};r.readAsDataURL(f)}
function home(){$("app").innerHTML='<h1>PERIHAL KHATIMI</h1><p class="sub">Pilih menu</p><button class="menu" id="m1"><small>MENU 1</small><b>PERISTIWA KHATIMI</b></button><a class="menu" href="'+PERBELANJAAN+'"><small>MENU 2</small><b>PERBELANJAAN KHATIMI</b></a>';$("m1").onclick=function(){rekod()}}
function head(on){return '<div class="top"><button id="hm">‹ Menu</button></div><h2>PERISTIWA KHATIMI</h2><div class="tabs"><button id="tr" class="'+(on=="r"?"on":"")+'">Perekodan</button><button id="tl" class="'+(on=="l"?"on":"")+'">Laporan</button></div>'}
function wire(){$("hm").onclick=home;$("tr").onclick=function(){rekod()};$("tl").onclick=laporan}
function total(){return oldIds.length-rmIds.length+newP.length}
function gal(){var h="";
oldIds.forEach(function(id){if(rmIds.indexOf(id)<0)h+='<div class="ph"><img src="'+thumb(id,300)+'" alt=""><button data-o="'+esc(id)+'">✕</button></div>'});
newP.forEach(function(u,i){h+='<div class="ph"><img src="'+u+'" alt=""><i>baharu</i><button data-n="'+i+'">✕</button></div>'});
$("gal").innerHTML=h;$("hint").textContent=total()?total()+" gambar (maksimum "+MAXP+")":"";
document.querySelectorAll("#gal button").forEach(function(b){b.onclick=function(){if(b.dataset.o)rmIds.push(b.dataset.o);else newP.splice(Number(b.dataset.n),1);gal()}})}
function rekod(it){var ed=!!(it&&it.id);newP=[];rmIds=[];pending=0;oldIds=ed?ids(it.photo):[];
$("app").innerHTML=head("r")+(ed?'<div class="edn">✏️ Menyunting peristiwa. Gambar baharu akan <b>ditambah</b> kepada gambar sedia ada. Tekan "Perekodan" untuk batal.</div>':"")+
'<label>TARIKH</label><input type="date" id="d" value="'+(ed?esc(it.date):today())+'"><label>JENIS PERISTIWA</label><select id="t">'+opts(ed?it.type:"")+'</select><label>KETERANGAN</label><textarea id="k" placeholder="Contoh: Hari lahir Yaya">'+(ed?esc(it.desc||""):"")+'</textarea><label>GAMBAR</label><div class="row"><button class="b" id="bc">📷 Ambil gambar</button><button class="b" id="bg">🖼️ Pilih dari galeri</button></div><input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="fg" accept="image/*" multiple hidden><div class="gal" id="gal"></div><div class="hint" id="hint"></div><button class="p" id="sv">'+(ed?"Simpan Perubahan":"Simpan Peristiwa")+'</button>';
wire();gal();
function got(e){var fs=Array.prototype.slice.call(e.target.files);e.target.value="";
fs.forEach(function(f){if(total()+pending>=MAXP){toast("Maksimum "+MAXP+" gambar");return}
pending++;shrink(f,function(u){pending--;if(u&&total()<MAXP)newP.push(u);gal()})})}
$("bc").onclick=function(){$("fc").click()};$("bg").onclick=function(){$("fg").click()};
$("fc").onchange=got;$("fg").onchange=got;
$("sv").onclick=function(){var k=$("k").value.trim(),d=$("d").value;
if(pending>0){toast("Tunggu gambar diproses...");return}
if(!d){toast("Sila pilih tarikh");return}if(!k&&!total()){toast("Isi keterangan atau gambar");return}
$("sv").disabled=true;$("sv").textContent="Menyimpan...";
var o={action:ed?"kemaskini":"simpan",id:ed?it.id:"",date:d,type:$("t").value,desc:k,photos:newP,removeIds:rmIds};
call(o).then(function(){toast(ed?"Dikemaskini ✓":"Disimpan ✓");if(ed)laporan();else rekod()}).catch(function(e){toast("Ralat: "+e.message);$("sv").disabled=false;$("sv").textContent=ed?"Simpan Perubahan":"Simpan Peristiwa"})}}
function laporan(){
$("app").innerHTML=head("l")+'<div class="row"><div><label>DARI</label><input type="date" id="a"></div><div><label>HINGGA</label><input type="date" id="z"></div></div><label>CARI (cth: yaya)</label><input type="search" id="s" placeholder="Cari keterangan..."><label>JENIS</label><select id="t">'+opts("",true)+'</select><div class="cnt" id="c">Memuatkan...</div><div id="l"></div>';
wire();
function v(i){return $(i).value}
function draw(){var a=v("a"),z=v("z"),s=v("s").toLowerCase(),t=v("t");
var r=DATA.filter(function(x){return(!a||x.date>=a)&&(!z||x.date<=z)&&(!t||x.type===t)&&(!s||(x.desc||"").toLowerCase().indexOf(s)>-1)});
r.sort(function(p,q){return q.date<p.date?-1:q.date>p.date?1:(q.ts<p.ts?-1:1)});
$("c").textContent=r.length+" peristiwa";
$("l").innerHTML=r.length?r.map(function(x){var p=ids(x.photo);return '<div class="it"><div class="meta"><span>'+esc(x.date)+'</span><span class="tag">'+esc(x.type)+'</span></div><p>'+esc(x.desc||"")+'</p>'+(p.length?'<div class="pics'+(p.length==1?" one":"")+'">'+p.map(function(id){return '<a href="'+thumb(id,1600)+'" target="_blank"><img loading="lazy" src="'+thumb(id,600)+'" alt=""></a>'}).join("")+'</div>':"")+'<div class="act"><button class="ed" data-id="'+esc(x.id)+'">✏️ Sunting</button><button class="del" data-id="'+esc(x.id)+'">Padam</button></div></div>'}).join(""):'<p class="note">Tiada peristiwa dijumpai.</p>';
document.querySelectorAll(".ed").forEach(function(b){b.onclick=function(){var it=DATA.filter(function(x){return x.id===b.dataset.id})[0];if(it){rekod(it);window.scrollTo(0,0)}}});
document.querySelectorAll(".del").forEach(function(b){b.onclick=function(){if(confirm("Padam peristiwa ini?"))call({action:"padam",id:b.dataset.id}).then(function(){DATA=DATA.filter(function(x){return x.id!==b.dataset.id});draw();toast("Dipadam")}).catch(function(e){toast("Ralat: "+e.message)})}})}
["a","z","s","t"].forEach(function(i){$(i).oninput=draw});
load().then(function(r){DATA=r||[];draw()}).catch(function(e){$("c").textContent="Ralat memuatkan data: "+e.message})}
home();
</script></body></html>
